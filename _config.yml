title: My Paper Diary
description: Personal research diary
theme: minima
repository: todd-jang/paper-diary
url: "https://todd-jang.github.io"
baseurl: "/paper-diary"
future: true

# Add custom navigation pages to the header
header_pages:
  - index.md
  - about.md

# Add links to your social profiles or sidebar equivalents in footer/header
minima:
  social_links:
    - { platform: github, user_url: "https://github.com/todd-jang" }
    
collections:
  papers:
    output: true
    permalink: /:collection/:name/
  notes:
    output: true
    permalink: /:collection/:name/
